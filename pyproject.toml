[project]
name = "zendure-p1"
version = "0.1.0"
description = "Async Python library for communicating with Zendure P1 Smart Meter"
authors = [{name = "Richard Leurs"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["zendure", "p1", "power", "energy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/NextNebula/zendure-p1"
Repository = "https://github.com/NextNebula/zendure-p1"
Issues = "https://github.com/NextNebula/zendure-p1/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
